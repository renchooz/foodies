apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: foodies-ns
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
  type: NodePort   

---

apiVersion: v1
kind: Service
metadata:
  name: backend-foodies
  namespace: foodies-ns
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
  type: ClusterIP
